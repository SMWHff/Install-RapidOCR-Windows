[project]
name = "install-rapidocr-windows"
version = "0.1.0"
description = "Windows 上部署并运行 RapidOCR 中文 OCR Web 服务（开发者用 uv 工作流）"
requires-python = ">=3.8,<3.9"
dependencies = [
    "fastapi==0.100.0",
    "uvicorn==0.23.2",
    "python-multipart==0.0.6",
    "pydantic==1.10.13",
    "numpy==1.21.6",
    "opencv-python==4.5.5.64",
    "pillow==9.5.0",
    "pyyaml==6.0.1",
    "shapely==1.8.5",
    "pyclipper==1.3.0.post5",
    "six==1.16.0",
    "tqdm==4.66.1",
    "onnxruntime==1.10.0",
    "rapidocr-onnxruntime==1.4.4",
]
